apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-node-deployment
  labels:
    app: cloud-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-node
  template:
    metadata:
      labels:
        app: cloud-node
    spec:
      containers:
      - name: cloud-server
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-node-service
spec:
  type: ClusterIP
  selector:
    app: cloud-node
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80